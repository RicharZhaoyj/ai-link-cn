@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #0a0f1a;
    --surface: #111827;
    --surface-2: #1f2937;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #a855f7;
    --accent-light: #c084fc;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --blue: #3b82f6;
}

body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;margin:0;padding:0}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

header{padding:16px 0;border-bottom:1px solid rgba(168,85,247,.2);background:rgba(10,15,26,.98);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:1.4rem;font-weight:700;color:var(--accent);text-decoration:none}
.nav-links{display:flex;gap:20px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav-links a{color:var(--text-muted);text-decoration:none;font-weight:500;font-size:.95rem;transition:color .2s}
.nav-links a:hover{color:var(--accent)}

.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-light));z-index:1000;width:0;transition:width .1s}

.hero{padding:48px 0 32px;text-align:center;background:linear-gradient(180deg,rgba(168,85,247,.08),transparent)}
.hero h1{font-size:2.2rem;line-height:1.3;margin-bottom:12px}
.hero h1 span{color:var(--accent)}
.hero p{font-size:1.05rem;color:var(--text-muted);max-width:600px;margin:0 auto 24px}
.hero-meta{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:.9rem;color:var(--text-muted)}
.hero-meta span{display:flex;align-items:center;gap:6px}

.tutorial-layout{display:grid;grid-template-columns:1fr 280px;gap:32px;padding:32px 0}
.tutorial-content{background:var(--surface);border-radius:16px;padding:40px;border:1px solid rgba(168,85,247,.1)}
.tutorial-content h2{font-size:1.6rem;color:var(--text);margin:40px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(168,85,247,.2)}
.tutorial-content h2:first-child{margin-top:0}
.tutorial-content h3{font-size:1.25rem;color:var(--text);margin:28px 0 12px}
.tutorial-content p{color:var(--text-muted);margin-bottom:16px}
.tutorial-content ul,.tutorial-content ol{color:var(--text-muted);margin-bottom:16px;padding-left:24px}
.tutorial-content li{margin-bottom:8px}
